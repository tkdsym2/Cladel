name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: ubuntu-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install

      # Translate node: llama.cpp `llama-server` sidecar (macOS only; declared
      # in tauri.macos.conf.json). Universal builds need the aarch64, x86_64
      # and lipo'd universal binaries. Cached per build-script revision (the
      # script pins the llama.cpp tag).
      - name: Cache llama-server sidecar
        if: matrix.platform == 'macos-latest'
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: llama-server-${{ runner.os }}-${{ hashFiles('scripts/build-llama.sh') }}

      - name: Build llama-server sidecar
        if: matrix.platform == 'macos-latest' && steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          command -v cmake || brew install cmake
          scripts/build-llama.sh universal-apple-darwin

      - name: Check llama-server sidecar
        if: matrix.platform == 'macos-latest'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            test -x "src-tauri/binaries/llama-server-$t" || { echo "missing llama-server-$t"; exit 1; }
          done
          lipo -archs src-tauri/binaries/llama-server-universal-apple-darwin

      - name: Validate release configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Filonex ${{ github.ref_name }}'
          releaseBody: 'See the assets for download links and installation instructions.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}
